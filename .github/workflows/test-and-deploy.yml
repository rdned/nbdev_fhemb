name: Test & Deploy

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  pins:
    uses: ./.github/workflows/reusable-pins.yml

  test:
    needs: pins
    uses: ./.github/workflows/reusable-container-run.yml
    with:
      fhemb_tag: ${{ needs.pins.outputs.fhemb_tag }}
      ci_utils_commit: ${{ needs.pins.outputs.ci_utils_commit }}
      nbdev_fhemb_image: ${{ needs.pins.outputs.nbdev_fhemb_image }}
      entrypoint: /usr/local/bin/test.sh
    secrets: inherit

  build_docs:
    needs:
      - pins
      - test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    uses: ./.github/workflows/reusable-container-run.yml
    with:
      fhemb_tag: ${{ needs.pins.outputs.fhemb_tag }}
      ci_utils_commit: ${{ needs.pins.outputs.ci_utils_commit }}
      nbdev_fhemb_image: ${{ needs.pins.outputs.nbdev_fhemb_image }}
      entrypoint: /usr/local/bin/build-docs.sh
      artifact_name: site-docs
    secrets: inherit

  deploy:
    needs: build_docs
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: site-docs
          path: _docs

      - name: Deploy to gh-pages
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_PAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          test -f _docs/index.html || { echo "ERROR: _docs/index.html not found in downloaded artifact"; exit 1; }

          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"
          git remote set-url origin "https://x-access-token:${GH_PAGES_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git checkout --orphan gh-pages
          git rm -rf .
          cp -a _docs/. .
          touch .nojekyll
          git add .
          git commit -m "docs: auto-generated documentation" || true
          git push origin gh-pages -f
