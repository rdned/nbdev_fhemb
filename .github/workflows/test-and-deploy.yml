name: Test & Deploy

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  pins:
    uses: ./.github/workflows/reusable-pins.yml

  test:
    needs: pins
    uses: ./.github/workflows/reusable-container-run.yml
    with:
      fhemb_tag: ${{ needs.pins.outputs.fhemb_tag }}
      ci_utils_commit: ${{ needs.pins.outputs.ci_utils_commit }}
      nbdev_fhemb_image: ${{ needs.pins.outputs.nbdev_fhemb_image }}
      entrypoint: /usr/local/bin/test-and-build.sh
      artifact_name: docs
    secrets: inherit

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Configure git init default branch
        run: git config --global init.defaultBranch main

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download docs artifact
        env:
          NODE_OPTIONS: --no-deprecation
        uses: actions/download-artifact@v4
        with:
          name: docs
          path: site

      - name: Deploy to gh-pages
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          git checkout --orphan gh-pages
          git rm -rf .
          cp -a site/. .
          touch .nojekyll
          git add .
          git commit -m "docs: auto-generated documentation" || true
          git push origin gh-pages -f
