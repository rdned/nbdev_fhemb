name: Test & Deploy

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  pins:
    uses: ./.github/workflows/reusable-pins.yml

  test_and_build:
    needs: pins
    uses: ./.github/workflows/reusable-container-run.yml
    with:
      fhemb_tag: ${{ needs.pins.outputs.fhemb_tag }}
      ci_utils_commit: ${{ needs.pins.outputs.ci_utils_commit }}
      nbdev_fhemb_image: ${{ needs.pins.outputs.nbdev_fhemb_image }}
      entrypoint: /usr/local/bin/combined.sh
      deploy_enabled: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
    secrets: inherit

  deploy:
    needs: test_and_build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Deploy notification
        run: echo "✓ Tests passed. Docs deployed to gh-pages."
